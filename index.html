<!doctype html>
<html lang="en">
<head>

<title>SETI: SIGNAL UNKNOWN</title>
<meta name="description" content="A fictional educational radio-astronomy simulation. Detect, analyze and decode an unknown signal.">

</head>
<body>
<canvas id="stars" aria-hidden="true"></canvas>
<header id="hud" hidden>

  <div class="seg" id="seg"><i></i><i></i><i></i><i></i><i></i></div>

<main id="app"></main>
<div id="toasts" aria-live="polite"></div>
<div id="modal" hidden role="dialog" aria-modal="true"></div>
<script src="script.js"></script>

</html>
